# sshd وكيل الربط داخل الحاوية — لا يقبل إلا عكس منفذ أوراكل من جهاز العميل.
# المفاتيح المسموحة تكتبها شاشة «ربط أوراكل» في authorized_keys مع permitlisten.
Port 2222
ListenAddress 0.0.0.0
PidFile /run/sshd_oralink.pid

HostKey /app/data/oralink/ssh_host_ed25519_key
AuthorizedKeysFile /app/data/oralink/authorized_keys

AllowUsers oralink
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
UsePAM no

# remote: نفق جهاز العميل (-R). local: نفق المطوّر (-L) إلى نهاية نفق العميل فقط.
# المنفذ 15210 = ORACLE_LINK_LOCAL_PORT الافتراضي — غيّره هنا إن غيّرت المتغير.
AllowTcpForwarding yes
PermitListen 127.0.0.1:15210
PermitOpen 127.0.0.1:15210
GatewayPorts no
AllowAgentForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
PermitTTY no
PermitUserRC no
ForceCommand /bin/false

# يحرر المنفذ المعكوس بسرعة عند انقطاع إنترنت العميل حتى يعود النفق
ClientAliveInterval 30
ClientAliveCountMax 3
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 5:50:20
LogLevel INFO
